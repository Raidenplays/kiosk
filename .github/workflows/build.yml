name: Build Kiosk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup environment
        run: git config --global safe.directory '*'
      - name: Install CIA tools
        run: |
          apt-get update && apt-get install -y p7zip-full
          curl -L https://github.com/Epicpkmn11/bannertool/releases/latest/download/bannertool.zip -o bannertool.zip
          7z e bannertool.zip linux-x86_64/bannertool && chmod +x bannertool && mv bannertool /usr/local/bin
          curl -L https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.17/makerom-v0.17-ubuntu_x86_64.zip -o makerom.zip
          7z e makerom.zip && chmod +x makerom && mv makerom /usr/local/bin
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: Kiosk
          path: |
            Kiosk.3dsx
            Kiosk.cia
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: true
          body: Built automatically from the newest commit on main.
          files: |
            Kiosk.3dsx
            Kiosk.cia
